name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      # Style > Use the pinned ktlint CLI with a verified checksum.
      - name: Ktlint check
        shell: bash
        run: |
          curl -fsSL -o ktlint.jar https://repo1.maven.org/maven2/com/pinterest/ktlint/ktlint-cli/1.8.0/ktlint-cli-1.8.0-all.jar
          echo "369ad2b789f95a011f807e1fcb690ccef80bd7cd014fd139e73ae82dcc0baeab  ktlint.jar" | sha256sum -c -
          java -jar ktlint.jar '**/*.kt' '**/*.kts' '!backup*/**' '!trackify_fix/**' '!**/build/**'

      # Style > Contract > Ikon Coolicons round dan gaya idiomatic tidak boleh regresi.
      - name: Contract grep
        shell: bash
        run: |
          if grep -RIn --include='*.kt' --include='*.kts' -E '\bsharp\b|\bIcons\.[A-Z]' app core baselineprofile; then
            exit 1
          fi

      # Tema > Satu sumber warna: colors.xml + facade TrackifyColors.kt.
      - name: Theme color guard
        shell: bash
        run: |
          if grep -RIn --include='*.kt' --include='*.kts' \
            -E 'Color\(0x|Color\.(White|Black|Red|Green|Blue|Yellow|Gray|Transparent|Unspecified)|colorResource\(' \
            app core baselineprofile --exclude='TrackifyColors.kt'; then
            exit 1
          fi
          if grep -RIn --include='*.xml' -E '#[0-9A-Fa-f]{3,8}' app/src/main/res --exclude='colors.xml'; then
            exit 1
          fi
          awk '
            function hexval(c) { return index("0123456789abcdef", tolower(c)) - 1 }
            function byte(s) { return hexval(substr(s, 1, 1)) * 16 + hexval(substr(s, 2, 1)) }
            {
              pos = index($0, "#")
              if (pos == 0) next
              hex = substr($0, pos + 1, 8)
              if (length(hex) != 8 || hex !~ /^[0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f]$/) {
                print "Token warna wajib 8 digit AARRGGBB: " $0
                bad = 1
                next
              }
              r = byte(substr(hex, 3, 2))
              g = byte(substr(hex, 5, 2))
              b = byte(substr(hex, 7, 2))
              lo = r; if (g < lo) lo = g; if (b < lo) lo = b
              hi = r; if (g > hi) hi = g; if (b > hi) hi = b
              if (hi - lo > 6) {
                print "Warna bukan monokrom netral: #" hex " (spread " hi - lo ")"
                bad = 1
              }
            }
            END { exit bad }
          ' app/src/main/res/values/colors.xml

      - name: Build and test
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest
