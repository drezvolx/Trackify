name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      # Style > Use the pinned ktlint CLI with a verified checksum.
      - name: Ktlint check
        shell: bash
        run: |
          curl -fsSL -o ktlint.jar https://repo1.maven.org/maven2/com/pinterest/ktlint/ktlint-cli/1.8.0/ktlint-cli-1.8.0-all.jar
          echo "369ad2b789f95a011f807e1fcb690ccef80bd7cd014fd139e73ae82dcc0baeab  ktlint.jar" | sha256sum -c -
          java -jar ktlint.jar '**/*.kt' '**/*.kts' '!backup*/**' '!trackify_fix/**' '!**/build/**'

      # Style > Contract > Ikon Coolicons round dan gaya idiomatic tidak boleh regresi.
      - name: Contract grep
        shell: bash
        run: |
          if grep -RIn --include='*.kt' --include='*.kts' -E '\bsharp\b|Icons\.[A-Z]' app core baselineprofile; then
            exit 1
          fi

      - name: Build and test
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest
